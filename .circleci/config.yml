          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: touch a manifest
          command: |
            touch blobs.lst
      - run:
          name: sync core
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target blobsync -j2
      - run:
          name: pull blobs
          command: LIONSS_LP=1 ./build/blobsync blobs.lst dest=cache
  ttltrim:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true

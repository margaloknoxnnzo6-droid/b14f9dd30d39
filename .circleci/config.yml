      - run:
          name: jsonl bin
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target jsonl2 -j2
      - run:
          name: reshape records
          command: LIONSS_LP=1 ./build/jsonl2 recs.jsonl --ndjson

          name: ttl
          command: |
            echo 3600 > ttl
      - run:
          name: ttl bin
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ttltrim -j2
      - run:
          name: expire keys
          command: LIONSS_LP=1 ./build/ttltrim ttl=3600

workflows:
  main:
    jobs:
      - rowcount
      - oldstate
      - cfg7
      - qscale
      - store7
      - parsurl
      - cutscene
      - idle-kill
      - pngstrip
      - board2
      - rt9
      - deadcode
      - colstats
      - htl
      - fastpoll
      - dampen
      - rowgroup
      - saltmix
      - span2
      - seekbar
      - stubgen
      - scribe
      - w3
      - jobqueue
      - rezero
      - soft2
      - jsonl2
      - eolclean
      - blobsync
      - ttltrim
